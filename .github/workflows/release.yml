name: Release

# App a ogni push su main: release "v<versione>" (versione automatica dai commit, vedi server/version.ts) con
# l'exe per Windows e lo zip per macOS (Apple Silicon e Intel). Ogni sistema compila il suo binario (Node SEA usa
# il node che esegue la build), poi un solo job pubblica. Il sito scarica sempre l'ultima:
# https://github.com/rkarmaaa/formula-monitor/releases/latest/download/FormulaMonitor.exe
# https://github.com/rkarmaaa/formula-monitor/releases/latest/download/FormulaMonitor-macOS-AppleSilicon.zip
# https://github.com/rkarmaaa/formula-monitor/releases/latest/download/FormulaMonitor-macOS-Intel.zip
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            file: release/FormulaMonitor.exe
          - os: macos-latest
            file: release/FormulaMonitor-macOS-AppleSilicon.zip
          - os: macos-15-intel
            file: release/FormulaMonitor-macOS-Intel.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # storia completa: la versione conta i commit
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:exe
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.os }}
          path: ${{ matrix.file }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - id: version
        run: echo "tag=v$(node -e "import('./server/version.ts').then((m) => console.log(m.appVersion()))")" >> "$GITHUB_OUTPUT"
      - name: Pubblica la release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          files=(release/FormulaMonitor.exe release/FormulaMonitor-macOS-AppleSilicon.zip release/FormulaMonitor-macOS-Intel.zip)
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" --target "$GITHUB_SHA" --title "Formula Monitor $TAG" --generate-notes --latest
          fi
